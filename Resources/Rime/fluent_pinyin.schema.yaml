# Fluent IME simplified full pinyin. Dictionary: adapted rime-wanxiang.
schema:
  schema_id: fluent_pinyin
  name: Fluent 简体拼音
  version: '1.8'
switches:
  - name: traditional
    reset: 0
  - name: emoji
    reset: 1
  - name: ascii_mode
    reset: 0
    states: [中, 英]
  - name: ascii_punct
    reset: 0
    states: [中文标点, 英文标点]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [simplifier@emoji, simplifier@traditional, uniquifier]
menu:
  page_size: 7
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Caps_Lock: noop
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - erase/^[mn]g?$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
translator:
  dictionary: fluent_pinyin
  enable_correction: false
  spelling_hints: 64
  always_show_comments: true
  user_dict: pinyin_simp
  enable_user_dict: true
  enable_sentence: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
emoji:
  option_name: emoji
  opencc_config: fluent_emoji.json
  tips: none
  inherit_comment: true
traditional:
  option_name: traditional
  opencc_config: fluent_s2t.json
  tips: none
  inherit_comment: true
key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: has_menu, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
    - { when: has_menu, accept: Tab, send: Down }
    - { when: has_menu, accept: 'Shift+Tab', send: Up }
punctuator:
  half_shape:
    ',': { commit: '，' }
    '.': { commit: '。' }
    '?': { commit: '？' }
    '!': { commit: '！' }
    ':': { commit: '：' }
    ';': { commit: '；' }
    '\': { commit: '、' }
    '(': '（'
    ')': '）'
    '[': '【'
    ']': '】'
    '<': '《'
    '>': '》'
    '"': { pair: ['“', '”'] }
    "'": { pair: ['‘', '’'] }
    '^': { commit: '……' }
    '_': { commit: '——' }
recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp:|mailto:).*$"
