# Generated by scripts/generate-schemas.py; edit the base schema.
# Fluent IME Zhuyin (注音) on the Dai-Chien (大千) keyboard.
# Adapted from rime-bopomofo bopomofo.schema.yaml (LGPL-3.0, Licenses/rime-bopomofo-LICENSE).
# Spelling rules: zhuyin.yaml, unmodified. Dictionary: Terra Pinyin, with tones.
# Variants are generated by scripts/generate-schemas.py.
schema:
  schema_id: fluent_bopomofo_l1
  name: Fluent 注音
  version: '1.0'
switches:
  - name: ascii_mode
    reset: 0
    states: [中, 英]
  - name: ascii_punct
    reset: 0
    states: [中文標點, 英文標點]
  - name: simplification
    reset: 0
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, fluency_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [simplifier@simplification, uniquifier]
menu:
  page_size: 9
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Caps_Lock: noop
speller:
  # Tones are syllable finals: Space ˉ, 6 ˊ, 3 ˇ, 4 ˋ, 7 ˙. A typed tone narrows the
  # candidates; tones and finals may be left out (zhuyin.yaml abbreviation).
  alphabet: '1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'
  initials: '1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-'
  finals: " 6347"
  delimiter: "'"
  use_space: true
  algebra:
    __patch:
      - zhuyin:/pinyin_to_zhuyin
      - zhuyin:/free_order
      - zhuyin:/abbreviation
      - zhuyin:/keymap_bopomofo
translator:
  dictionary: terra_pinyin
  prism: fluent_bopomofo
  user_dict: fluent_bopomofo
  enable_user_dict: true
  preedit_format:
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙ |"
editor:
  bindings:
    # Space only types the first tone. When Rime does not take it, Fluent opens the
    # candidate list instead of confirming the composition.
    space: noop
simplification:
  # The dictionary is Traditional Chinese; the Simplified mode converts it.
  option_name: simplification
  opencc_config: fluent_t2s.json
  tips: none
punctuator:
  half_shape:
    "<" : { commit: "，" }
    ">" : { commit: "。" }
    "?" : [ ？, ／, "/", ÷ ]
    ":" : [ ：, ； ]
    "'" : { pair: [ "‘", "’" ] }
    "\"" : { pair: [ "“", "”" ] }
    "\\" : [ 、, "\\", ＼ ]
    "|" : [ ·, "|", ｜, "§", "¦" ]
    "`" : "`"
    "~" : "~"
    "!" : { commit: ！ }
    "@" : { commit: "@" }
    "#" : { commit: "#" }
    "%" : [ "%", ％, "°", "℃" ]
    "$" : [ ￥, "$", "€", "£", "¥", "¢", "¤" ]
    "^" : { commit: …… }
    "&" : { commit: "&" }
    "*" : [ "*", ＊, ·, ・, ×, ※, ❂ ]
    "(" : { commit: （ }
    ")" : { commit: ） }
    "_" : [ ——, －, "-" ]
    "+" : "+"
    "=" : "="
    "[" : [ 「, 【, 《, 〔, ［ ]
    "]" : [ 」, 】, 》, 〕, ］ ]
    "{" : [ 『, 〖, 〈, ｛ ]
    "}" : [ 』, 〗, 〉, ｝ ]
recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp:|mailto:).*$"
